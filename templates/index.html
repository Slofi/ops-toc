<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Map App</title>
  <link rel="stylesheet" href="/static/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header id="toolbar">
    <div class="brand">Map</div>
    <button class="btn" id="markers-btn">Markers</button>
    <button class="btn" id="add-marker-btn">Add Marker</button>
    <span class="sep"></span>
    <button class="btn" id="measure-btn">Ruler</button>
    <button class="btn" id="draw-line-btn">Draw Line</button>
    <button class="btn" id="draw-poly-btn">Draw Area</button>
    <button class="btn" id="finish-tool-btn" hidden>Finish</button>
    <button class="btn danger" id="cancel-tool-btn" hidden>Cancel</button>
    <span class="spacer"></span>
    <select id="layer-select" title="Map layer"></select>
    <a class="btn" href="/api/export/geojson" target="_blank" rel="noopener">Export</a>
  </header>

  <main id="main">
    <aside id="side-panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Markers</div>
          <div class="panel-subtitle">Owned by Map App. OM should consume these later.</div>
        </div>
        <button class="btn small" id="close-panel-btn">Close</button>
      </div>
      <div id="marker-list"></div>
      <div class="panel-head border-top">
        <div>
          <div class="panel-title">Drawings</div>
          <div class="panel-subtitle">Lines, areas, saved ruler paths.</div>
        </div>
      </div>
      <div id="drawing-list"></div>
    </aside>

    <section id="map-wrap">
      <div id="banner"></div>
      <div id="measure-card">
        <div class="card-title">Ruler</div>
        <div id="measure-total">0 m</div>
        <div id="measure-help">Tap points on the map. Drag points to adjust.</div>
      </div>
      <div id="map"></div>
    </section>
  </main>

  <dialog id="marker-dialog">
    <form method="dialog" id="marker-form">
      <h2 id="marker-title">Marker</h2>
      <input type="hidden" id="marker-id">
      <input type="hidden" id="marker-lat">
      <input type="hidden" id="marker-lon">
      <label>Name
        <input id="marker-name" maxlength="80" required>
      </label>
      <label>Description
        <textarea id="marker-desc" maxlength="400" rows="3"></textarea>
      </label>
      <label>Icon text
        <input id="marker-emoji" maxlength="24" placeholder="pin">
      </label>
      <label>Category
        <input id="marker-category" maxlength="40" placeholder="note">
      </label>
      <div id="marker-status"></div>
      <div class="dialog-actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn primary" id="marker-save-btn" value="default">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/static/leaflet/leaflet.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
